services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signalfeed
      POSTGRES_PASSWORD: signalfeed
      POSTGRES_DB: signalfeed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalfeed"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://signalfeed:signalfeed@db:5432/signalfeed
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: